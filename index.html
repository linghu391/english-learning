<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%236366f1'/%3E%3Ctext x='96' y='130' text-anchor='middle' fill='white' font-size='100' font-weight='bold' font-family='sans-serif'%3EE%3C/text%3E%3C/svg%3E">
  <title>英语语料工作台</title>
  <link rel="stylesheet" href="style.css">
  <!-- Prevent FOUC -->
  <style>body:not(.loaded) #app { opacity: 0; }</style>
</head>
<body>
  <div id="app">
    <!-- Loading State -->
    <div id="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-text">加载今日语料...</div>
    </div>

    <!-- Error State -->
    <div id="error-screen" style="display:none">
      <div class="error-icon">⚠️</div>
      <div class="error-text">加载失败</div>
      <div class="error-sub">请检查网络连接后重试</div>
      <button id="retry-btn" class="btn-primary">重新加载</button>
    </div>

    <!-- Main App -->
    <div id="main-app" style="display:none">
      <!-- Header -->
      <header id="header">
        <div class="header-top">
          <div class="header-left">
            <span class="header-emoji">📖</span>
            <span class="header-date" id="date-display"></span>
          </div>
          <div class="header-right">
            <span class="progress-ring-wrap">
              <svg class="progress-ring" width="32" height="32">
                <circle class="progress-ring-bg" cx="16" cy="16" r="14"/>
                <circle class="progress-ring-fill" cx="16" cy="16" r="14" id="progress-ring"/>
              </svg>
              <span class="progress-text" id="progress-text">0%</span>
            </span>
          </div>
        </div>
        <div class="header-bottom">
          <span class="header-topic" id="topic-display"></span>
          <span class="header-duration" id="duration-display"></span>
        </div>
        <!-- Progress bar -->
        <div class="header-progress-bar">
          <div class="header-progress-fill" id="progress-bar"></div>
        </div>
        <!-- Difficulty selector -->
        <div id="difficulty-selector"></div>
      </header>

      <!-- Content Area -->
      <main id="content"></main>

      <!-- Tab Bar -->
      <nav id="tab-bar">
        <button class="tab-btn active" data-tab="reading">
          <span class="tab-icon">📖</span>
          <span class="tab-label">阅读</span>
        </button>
        <button class="tab-btn" data-tab="listening">
          <span class="tab-icon">👂</span>
          <span class="tab-label">听力</span>
        </button>
        <button class="tab-btn" data-tab="speaking">
          <span class="tab-icon">🗣️</span>
          <span class="tab-label">口语</span>
        </button>
        <button class="tab-btn" data-tab="writing">
          <span class="tab-icon">✍️</span>
          <span class="tab-label">写作</span>
        </button>
        <button class="tab-btn" data-tab="vocabulary">
          <span class="tab-icon">📚</span>
          <span class="tab-label">词汇</span>
        </button>
      </nav>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
